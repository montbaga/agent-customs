name: "Agent Customs Check"
description: "Inspect agent networks, A2A Agent Cards, and MCP manifests in pull requests without external dependencies."
inputs:
  target:
    description: "Space-separated URLs, local folders, or JSON manifests to inspect"
    required: true
  strict:
    description: "Fail on HELD or CONDITIONS verdicts"
    required: false
    default: "false"
  allow-hold:
    description: "Exit 0 when verdict is HOLD"
    required: false
    default: "false"
  transitive:
    description: "Follow cross-origin downstream partners"
    required: false
    default: "false"
  sarif-file:
    description: "Optional path to write a SARIF v2.1.0 report"
    required: false
    default: ""
outputs:
  exit-code:
    description: "CLI exit code (0 passed, 1 hold, 2 denied/error)"
    value: ${{ steps.run.outputs.code }}
  sarif-file:
    description: "Written SARIF file path when requested"
    value: ${{ steps.run.outputs.sarif }}
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"
    - id: run
      shell: bash
      env:
        AC_TARGET: ${{ inputs.target }}
        AC_STRICT: ${{ inputs.strict }}
        AC_ALLOW_HOLD: ${{ inputs.allow-hold }}
        AC_TRANSITIVE: ${{ inputs.transitive }}
        AC_SARIF: ${{ inputs.sarif-file }}
        AC_PATH: ${{ github.action_path }}
      run: |
        set +e
        read -ra TARGETS <<< "$AC_TARGET"
        FLAGS=()
        [ "$AC_STRICT" = "true" ] && FLAGS+=(--strict)
        [ "$AC_ALLOW_HOLD" = "true" ] && FLAGS+=(--allow-hold)
        [ "$AC_TRANSITIVE" = "true" ] && FLAGS+=(--transitive)
        if [ -n "$AC_SARIF" ]; then
          node "$AC_PATH/bin/agent-customs.mjs" check "${TARGETS[@]}" "${FLAGS[@]}" --sarif > "$AC_SARIF"
          CODE=$?
          echo "sarif=$AC_SARIF" >> "$GITHUB_OUTPUT"
        else
          node "$AC_PATH/bin/agent-customs.mjs" check "${TARGETS[@]}" "${FLAGS[@]}"
          CODE=$?
        fi
        echo "code=$CODE" >> "$GITHUB_OUTPUT"
        exit $CODE
