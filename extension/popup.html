<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Agent Customs Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <img src="icons/icon48.png" width="22" height="22" alt="">
      <span>Agent Customs</span>
    </div>
    <span id="ext-proto" class="proto" hidden></span>
  </header>

  <form id="ext-form" class="bar">
    <input id="ext-url" type="url" spellcheck="false" placeholder="https://site.example" aria-label="Site or endpoint URL">
    <button type="submit" id="ext-go">Inspect</button>
  </form>

  <main id="ext-out" class="out" aria-live="polite">
    <p class="muted">Checking current tab for Open Agentic Web, A2A, or MCP endpoints…</p>
  </main>

  <footer class="foot">
    <a id="ext-open-desk" href="https://montbaga.github.io/agent-customs/" target="_blank" rel="noopener noreferrer">Open in Desk ↗</a>
    <span>Runs locally · $0 keys</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
