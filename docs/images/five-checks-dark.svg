<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 206" width="1200" height="206" role="img" aria-label="The Five Border Checks: Papers, Contraband, Itinerary, Privacy, Identity">
  <defs>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
      @keyframes gateBeacon {
        0%, 100% { opacity: 0.25; transform: scale(0.9); }
        20% { opacity: 1; transform: scale(1.25); }
        45% { opacity: 0.25; transform: scale(0.9); }
      }
      @keyframes barWave {
        0%, 100% { opacity: 0.2; }
        20% { opacity: 0.95; }
        45% { opacity: 0.2; }
      }
      .g1 { animation: gateBeacon 4s ease-in-out 0s infinite; transform-box: fill-box; transform-origin: center; }
      .g2 { animation: gateBeacon 4s ease-in-out 0.7s infinite; transform-box: fill-box; transform-origin: center; }
      .g3 { animation: gateBeacon 4s ease-in-out 1.4s infinite; transform-box: fill-box; transform-origin: center; }
      .g4 { animation: gateBeacon 4s ease-in-out 2.1s infinite; transform-box: fill-box; transform-origin: center; }
      .g5 { animation: gateBeacon 4s ease-in-out 2.8s infinite; transform-box: fill-box; transform-origin: center; }
      .b1 { animation: barWave 4s ease-in-out 0s infinite; }
      .b2 { animation: barWave 4s ease-in-out 0.7s infinite; }
      .b3 { animation: barWave 4s ease-in-out 1.4s infinite; }
      .b4 { animation: barWave 4s ease-in-out 2.1s infinite; }
      .b5 { animation: barWave 4s ease-in-out 2.8s infinite; }
      @media (prefers-reduced-motion: reduce) {
        .g1, .g2, .g3, .g4, .g5, .b1, .b2, .b3, .b4, .b5 { animation: none; opacity: 0.85; }
      }
    </style>
  </defs>

  <rect x="4" y="4" width="1192" height="198" rx="18" fill="#0c1d18" stroke="#ece4d3" stroke-opacity="0.16" stroke-width="1.5"/>
  <text x="28" y="30" class="mono" font-size="11" font-weight="700" letter-spacing="1.4" fill="#c8f03c">FIVE INSPECTION GATES · DETERMINISTIC RULES</text>
  <text x="1172" y="30" text-anchor="end" class="mono" font-size="11" fill="#ece4d3" fill-opacity="0.52">RUNS IN BROWSER · ZERO KEYS LEAKED</text>

  <!-- Gate 1: Papers -->
  <g transform="translate(24, 44)">
    <rect width="216" height="138" rx="13" fill="#122821" stroke="#ece4d3" stroke-opacity="0.16"/>
    <rect x="16" y="4" width="184" height="2.5" rx="1.25" fill="#c8f03c" class="b1"/>
    <rect x="16" y="16" width="54" height="20" rx="5" fill="#1b3a30"/>
    <text x="43" y="30" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#c8f03c">01 · MVP</text>
    <circle cx="192" cy="26" r="4" fill="#c8f03c" class="g1"/>
    <text x="16" y="64" class="sans" font-size="18" font-weight="700" fill="#ece4d3">Papers</text>
    <text x="16" y="88" class="sans" font-size="12.5" fill="#cfc7b5">Spec checks (profile 0.2),</text>
    <text x="16" y="106" class="sans" font-size="12.5" fill="#cfc7b5">CORS headers &amp; exposed</text>
    <text x="16" y="124" class="sans" font-size="12.5" fill="#cfc7b5">keys in public files.</text>
  </g>

  <!-- Gate 2: Contraband -->
  <g transform="translate(258, 44)">
    <rect width="216" height="138" rx="13" fill="#231314" stroke="#f2665a" stroke-opacity="0.45"/>
    <rect x="16" y="4" width="184" height="2.5" rx="1.25" fill="#f2665a" class="b2"/>
    <rect x="16" y="16" width="66" height="20" rx="5" fill="#f2665a" fill-opacity="0.18"/>
    <text x="49" y="30" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#f2665a">02 · X-RAY</text>
    <circle cx="192" cy="26" r="4" fill="#f2665a" class="g2"/>
    <text x="16" y="64" class="sans" font-size="18" font-weight="700" fill="#ece4d3">Contraband</text>
    <text x="16" y="88" class="sans" font-size="12.5" fill="#d9cebf">Hidden Unicode, prompt</text>
    <text x="16" y="106" class="sans" font-size="12.5" fill="#d9cebf">injection, card &amp; password</text>
    <text x="16" y="124" class="sans" font-size="12.5" fill="#d9cebf">phishing, leak links.</text>
  </g>

  <!-- Gate 3: Itinerary -->
  <g transform="translate(492, 44)">
    <rect width="216" height="138" rx="13" fill="#122821" stroke="#ece4d3" stroke-opacity="0.16"/>
    <rect x="16" y="4" width="184" height="2.5" rx="1.25" fill="#8fd1a6" class="b3"/>
    <rect x="16" y="16" width="76" height="20" rx="5" fill="#1b3a30"/>
    <text x="54" y="30" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#8fd1a6">03 · ROUTE</text>
    <circle cx="192" cy="26" r="4" fill="#8fd1a6" class="g3"/>
    <text x="16" y="64" class="sans" font-size="18" font-weight="700" fill="#ece4d3">Itinerary</text>
    <text x="16" y="88" class="sans" font-size="12.5" fill="#cfc7b5">Maps every remote site,</text>
    <text x="16" y="106" class="sans" font-size="12.5" fill="#cfc7b5">MCP server &amp; code bundle</text>
    <text x="16" y="124" class="sans" font-size="12.5" fill="#cfc7b5">against its own policy.</text>
  </g>

  <!-- Gate 4: Privacy -->
  <g transform="translate(726, 44)">
    <rect width="216" height="138" rx="13" fill="#122821" stroke="#ece4d3" stroke-opacity="0.16"/>
    <rect x="16" y="4" width="184" height="2.5" rx="1.25" fill="#e9c46a" class="b4"/>
    <rect x="16" y="16" width="70" height="20" rx="5" fill="#1b3a30"/>
    <text x="51" y="30" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#e9c46a">04 · SLY</text>
    <circle cx="192" cy="26" r="4" fill="#e9c46a" class="g4"/>
    <text x="16" y="64" class="sans" font-size="18" font-weight="700" fill="#ece4d3">Privacy</text>
    <text x="16" y="88" class="sans" font-size="12.5" fill="#cfc7b5">Inspects which private</text>
    <text x="16" y="106" class="sans" font-size="12.5" fill="#cfc7b5">context (sly_data) crosses</text>
    <text x="16" y="124" class="sans" font-size="12.5" fill="#cfc7b5">a website boundary.</text>
  </g>

  <!-- Gate 5: Identity -->
  <g transform="translate(960, 44)">
    <rect width="216" height="138" rx="13" fill="#152d25" stroke="#c8f03c" stroke-opacity="0.45"/>
    <rect x="16" y="4" width="184" height="2.5" rx="1.25" fill="#c8f03c" class="b5"/>
    <rect x="16" y="16" width="66" height="20" rx="5" fill="#c8f03c" fill-opacity="0.18"/>
    <text x="49" y="30" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#c8f03c">05 · SEAL</text>
    <circle cx="192" cy="26" r="4" fill="#c8f03c" class="g5"/>
    <text x="16" y="64" class="sans" font-size="18" font-weight="700" fill="#ece4d3">Identity</text>
    <text x="16" y="88" class="sans" font-size="12.5" fill="#cfc7b5">SHA-256 version pins,</text>
    <text x="16" y="106" class="sans" font-size="12.5" fill="#cfc7b5">rug-pull diffs, homoglyphs</text>
    <text x="16" y="124" class="sans" font-size="12.5" fill="#cfc7b5">&amp; look-alike domains.</text>
  </g>
</svg>
