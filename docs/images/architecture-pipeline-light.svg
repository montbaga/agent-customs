<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="One inspection, step by step: find the files, unhide the text, five checks, data paths, stamp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/><stop offset="55%" stop-color="#ece4d3"/><stop offset="100%" stop-color="#e3d8c2"/>
    </linearGradient>
    <radialGradient id="glow-lime" cx="0.2" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#c8f03c" stop-opacity="0.24"/><stop offset="100%" stop-color="#c8f03c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="0.85" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#f2665a" stop-opacity="0.1"/><stop offset="100%" stop-color="#f2665a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0c1d18" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d6b0a"/>
    </marker>
    <clipPath id="clip"><rect x="4" y="4" width="1192" height="292" rx="20"/></clipPath>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .pulse { animation: pulseDot 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="1192" height="292" rx="20" fill="url(#bg)"/>
    <rect x="4" y="4" width="1192" height="292" rx="20" fill="url(#grid)"/>
    <rect x="4" y="4" width="1192" height="292" rx="20" fill="url(#glow-lime)"/>
    <rect x="4" y="4" width="1192" height="292" rx="20" fill="url(#glow-red)"/>
    <text x="34" y="38" class="mono" font-size="11" font-weight="700" letter-spacing="1.4" fill="#3d6b0a">ONE INSPECTION, STEP BY STEP</text>
    <text x="1166" y="38" text-anchor="end" class="mono" font-size="11" fill="#0c1d18" fill-opacity="0.58">RUNS IN THE BROWSER · NO SERVER · NO AI MODEL</text>
    <line x1="34" y1="52" x2="1166" y2="52" stroke="#0c1d18" stroke-opacity="0.12"/>
    <rect x="37" y="76" width="206" height="164" rx="14" fill="#faf6ee" stroke="#0c1d18" stroke-opacity="0.18"/>
    <rect x="55" y="92" width="38" height="22" rx="6" fill="#0c1d18"/>
    <text x="74" y="107" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">01</text>
    <text x="55" y="142" class="sans" font-size="16.5" font-weight="700" fill="#0c1d18">Find the files</text>
    <text x="55" y="166" class="sans" font-size="13" fill="#2d413b">Reads the partner's agent</text>
    <text x="55" y="185" class="sans" font-size="13" fill="#2d413b">files: Open Agentic Web,</text>
    <text x="55" y="204" class="sans" font-size="13" fill="#2d413b">Google A2A or MCP.</text>
    <line x1="246" y1="158" x2="263" y2="158" stroke="#3d6b0a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="267" y="76" width="206" height="164" rx="14" fill="#faf6ee" stroke="#0c1d18" stroke-opacity="0.18"/>
    <rect x="285" y="92" width="38" height="22" rx="6" fill="#0c1d18"/>
    <text x="304" y="107" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">02</text>
    <text x="285" y="142" class="sans" font-size="16.5" font-weight="700" fill="#0c1d18">Unhide the text</text>
    <text x="285" y="166" class="sans" font-size="13" fill="#2d413b">Decodes invisible</text>
    <text x="285" y="185" class="sans" font-size="13" fill="#2d413b">characters, look-alike</text>
    <text x="285" y="204" class="sans" font-size="13" fill="#2d413b">letters and Base64.</text>
    <line x1="476" y1="158" x2="493" y2="158" stroke="#3d6b0a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="497" y="76" width="206" height="164" rx="14" fill="#faf6ee" stroke="#0c1d18" stroke-opacity="0.18"/>
    <rect x="515" y="92" width="38" height="22" rx="6" fill="#0c1d18"/>
    <text x="534" y="107" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">03</text>
    <text x="515" y="142" class="sans" font-size="16.5" font-weight="700" fill="#0c1d18">Five checks</text>
    <text x="515" y="166" class="sans" font-size="13" fill="#2d413b">Papers, Contraband,</text>
    <text x="515" y="185" class="sans" font-size="13" fill="#2d413b">Itinerary, Privacy and</text>
    <text x="515" y="204" class="sans" font-size="13" fill="#2d413b">Identity.</text>
    <line x1="706" y1="158" x2="723" y2="158" stroke="#3d6b0a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="727" y="76" width="206" height="164" rx="14" fill="#faf6ee" stroke="#0c1d18" stroke-opacity="0.18"/>
    <rect x="745" y="92" width="38" height="22" rx="6" fill="#0c1d18"/>
    <text x="764" y="107" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">04</text>
    <text x="745" y="142" class="sans" font-size="16.5" font-weight="700" fill="#0c1d18">Data paths</text>
    <text x="745" y="166" class="sans" font-size="13" fill="#2d413b">Can outside text reach</text>
    <text x="745" y="185" class="sans" font-size="13" fill="#2d413b">private data and then</text>
    <text x="745" y="204" class="sans" font-size="13" fill="#2d413b">send it somewhere?</text>
    <line x1="936" y1="158" x2="953" y2="158" stroke="#3d6b0a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="957" y="76" width="206" height="164" rx="14" fill="#0c1d18" />
    <rect x="975" y="92" width="38" height="22" rx="6" fill="#c8f03c"/>
    <text x="994" y="107" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#0c1d18">05</text>
    <text x="975" y="142" class="sans" font-size="16.5" font-weight="700" fill="#ece4d3">Stamp</text>
    <text x="975" y="166" class="sans" font-size="13" fill="#d3cbb9">Cleared, Cleared with</text>
    <text x="975" y="185" class="sans" font-size="13" fill="#d3cbb9">conditions, Held for</text>
    <text x="975" y="204" class="sans" font-size="13" fill="#d3cbb9">review or Entry denied.</text>
    <text x="34" y="276" class="mono" font-size="11" fill="#0c1d18" fill-opacity="0.58">Fixed rules decide the stamp. Wording that only looks harmless lowers a finding to a note; it never removes it.</text>
  </g>
</svg>
