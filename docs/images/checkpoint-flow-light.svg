<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="How the Agent Customs Guard checks every partner call">
  <defs>
    <clipPath id="flow-clip">
      <rect x="4" y="4" width="1192" height="272" rx="18"/>
    </clipPath>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#3d6b0a"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#1b6b3a"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#9e5210"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#b42318"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
      @keyframes dashMove {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes guardGlow {
        0%, 100% { stroke: #c8f03c; stroke-opacity: 0.35; }
        50% { stroke: #c8f03c; stroke-opacity: 1; }
      }
      .flow-line { stroke-dasharray: 6 6; animation: dashMove 1.4s linear infinite; }
      .guard-card { stroke-width: 1.8; animation: guardGlow 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flow-line, .guard-card { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#flow-clip)">
    <rect x="4" y="4" width="1192" height="272" rx="18" fill="#f3ede0"/>

    <text x="34" y="34" class="mono" font-size="11" font-weight="700" letter-spacing="1.4" fill="#3d6b0a">LIVE BORDER CHECKPOINT FLOW</text>
    <text x="1166" y="34" text-anchor="end" class="mono" font-size="11" fill="#0c1d18" fill-opacity="0.58">RUNS AFTER CONSENT · BEFORE EXECUTION</text>
    <line x1="34" y1="48" x2="1166" y2="48" stroke="#0c1d18" stroke-opacity="0.12"/>

    <!-- Station 1 -->
    <rect x="34" y="80" width="222" height="148" rx="14" fill="#faf6ee" stroke="#0c1d18" stroke-opacity="0.18"/>
    <rect x="52" y="96" width="38" height="22" rx="6" fill="#0c1d18"/>
    <text x="71" y="111" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">01</text>
    <text x="52" y="144" class="sans" font-size="17" font-weight="700" fill="#0c1d18">Partner call</text>
    <text x="52" y="169" class="sans" font-size="13" fill="#2d413b">Your site's AI asks to</text>
    <text x="52" y="187" class="sans" font-size="13" fill="#2d413b">consult another website's</text>
    <text x="52" y="205" class="sans" font-size="13" fill="#2d413b">agent network.</text>

    <line x1="262" y1="154" x2="294" y2="154" stroke="#3d6b0a" stroke-width="2" class="flow-line" marker-end="url(#arrow-ink)"/>

    <!-- Station 2 -->
    <rect x="302" y="80" width="222" height="148" rx="14" fill="#faf6ee" stroke="#0c1d18" stroke-opacity="0.18"/>
    <rect x="320" y="96" width="38" height="22" rx="6" fill="#0c1d18"/>
    <text x="339" y="111" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">02</text>
    <text x="320" y="144" class="sans" font-size="17" font-weight="700" fill="#0c1d18">Consent card</text>
    <text x="320" y="169" class="sans" font-size="13" fill="#2d413b">Visitor agrees first. If</text>
    <text x="320" y="187" class="sans" font-size="13" fill="#2d413b">declined, zero bytes are</text>
    <text x="320" y="205" class="sans" font-size="13" fill="#2d413b">fetched or loaded.</text>

    <line x1="530" y1="154" x2="562" y2="154" stroke="#3d6b0a" stroke-width="2" class="flow-line" marker-end="url(#arrow-ink)"/>

    <!-- Station 3 -->
    <rect x="570" y="72" width="246" height="164" rx="14" fill="#0c1d18" class="guard-card"/>
    <rect x="588" y="88" width="136" height="22" rx="6" fill="#c8f03c"/>
    <text x="656" y="103" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#0c1d18">03 · CUSTOMS GUARD</text>
    <text x="588" y="138" class="sans" font-size="17" font-weight="700" fill="#ece4d3">Inspect &amp; lock</text>
    <text x="588" y="163" class="sans" font-size="13" fill="#d3cbb9">Checks compiled files</text>
    <text x="588" y="181" class="sans" font-size="13" fill="#d3cbb9">against fixed rules, pins,</text>
    <text x="588" y="199" class="sans" font-size="13" fill="#d3cbb9">and runtime secret locks.</text>
    <text x="588" y="220" class="mono" font-size="10.5" fill="#c8f03c">RULES DECIDE · NOT AN LLM</text>

    <!-- Branching connectors -->
    <path d="M 816 116 C 844 116, 844 91, 868 91" fill="none" stroke="#1b6b3a" stroke-width="2" class="flow-line" marker-end="url(#arrow-ok)"/>
    <path d="M 816 154 L 868 154" fill="none" stroke="#9e5210" stroke-width="2" class="flow-line" marker-end="url(#arrow-warn)"/>
    <path d="M 816 192 C 844 192, 844 217, 868 217" fill="none" stroke="#b42318" stroke-width="2" class="flow-line" marker-end="url(#arrow-bad)"/>

    <!-- Outcome 1: Cleared -->
    <rect x="876" y="64" width="290" height="54" rx="11" fill="#edf7f0" stroke="#1b6b3a" stroke-opacity="0.4"/>
    <rect x="890" y="79" width="84" height="24" rx="5" fill="#1b6b3a"/>
    <text x="932" y="95" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">CLEARED</text>
    <text x="986" y="88" class="sans" font-size="13" font-weight="700" fill="#0c1d18">Runs &amp; locks version</text>
    <text x="986" y="105" class="sans" font-size="11.5" fill="#3a4c46">Saves SHA-256 fingerprint</text>

    <!-- Outcome 2: Held -->
    <rect x="876" y="127" width="290" height="54" rx="11" fill="#fdf3e7" stroke="#9e5210" stroke-opacity="0.4"/>
    <rect x="890" y="142" width="84" height="24" rx="5" fill="#9e5210"/>
    <text x="932" y="158" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">HELD</text>
    <text x="986" y="151" class="sans" font-size="13" font-weight="700" fill="#0c1d18">Asks visitor first</text>
    <text x="986" y="168" class="sans" font-size="11.5" fill="#3a4c46">Shows issues or rug-pull diff</text>

    <!-- Outcome 3: Denied -->
    <rect x="876" y="190" width="290" height="54" rx="11" fill="#fdeceb" stroke="#b42318" stroke-opacity="0.45"/>
    <rect x="890" y="205" width="84" height="24" rx="5" fill="#b42318"/>
    <text x="932" y="221" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#ffffff">DENIED</text>
    <text x="986" y="214" class="sans" font-size="13" font-weight="700" fill="#0c1d18">Refused immediately</text>
    <text x="986" y="231" class="sans" font-size="11.5" fill="#3a4c46">Nothing runs; safe summary only</text>

    <!-- Live SMIL Packet Orb gliding along the track -->
    <circle r="4.5" fill="#3d6b0a">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M 256 154 L 302 154 M 524 154 L 570 154 M 816 116 C 844 116, 844 91, 874 91"/>
    </circle>

    <rect x="4.75" y="4.75" width="1190.5" height="270.5" rx="17.25" fill="none" stroke="#0c1d18" stroke-opacity="0.18" stroke-width="1.5"/>
  </g>
</svg>
