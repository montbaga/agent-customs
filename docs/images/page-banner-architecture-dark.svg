<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="How Agent Customs works: one inspection, then a guard that stays on">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091712"/><stop offset="55%" stop-color="#0c1d18"/><stop offset="100%" stop-color="#122a22"/>
    </linearGradient>
    <radialGradient id="glow-lime" cx="0.2" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#c8f03c" stop-opacity="0.18"/><stop offset="100%" stop-color="#c8f03c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="0.85" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#f2665a" stop-opacity="0.12"/><stop offset="100%" stop-color="#f2665a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ece4d3" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c8f03c"/>
    </marker>
    <clipPath id="clip"><rect x="4" y="4" width="1192" height="352" rx="20"/></clipPath>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .pulse { animation: pulseDot 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="1192" height="352" rx="20" fill="url(#bg)"/>
    <rect x="4" y="4" width="1192" height="352" rx="20" fill="url(#grid)"/>
    <rect x="4" y="4" width="1192" height="352" rx="20" fill="url(#glow-lime)"/>
    <rect x="4" y="4" width="1192" height="352" rx="20" fill="url(#glow-red)"/>
    <rect x="52" y="44" width="251" height="30" rx="15" fill="#132d25" stroke="#c8f03c" stroke-opacity="0.38"/>
    <circle cx="71" cy="59" r="4.5" fill="#c8f03c" class="pulse"/>
    <text x="86" y="63" class="mono" font-size="11" font-weight="600" letter-spacing="1.4" fill="#c8f03c">HOW IT WORKS · ARCHITECTURE</text>
    <g transform="translate(52, 92)">
      <rect width="54" height="54" rx="12" fill="#091712" stroke="#c8f03c" stroke-opacity="0.55" stroke-width="1.5"/>
      <rect x="10" y="10" width="14" height="12" rx="2.5" fill="none" stroke="#c8f03c" stroke-width="2.4"/><rect x="30" y="10" width="14" height="12" rx="2.5" fill="none" stroke="#c8f03c" stroke-width="2.4"/><rect x="20" y="32" width="14" height="12" rx="2.5" fill="none" stroke="#c8f03c" stroke-width="2.4"/><path d="M17 22v5h20v-5M27 27v5" fill="none" stroke="#c8f03c" stroke-width="2.2"/>
    </g>
    <text x="122" y="134" class="sans" font-size="46" font-weight="700" letter-spacing="-1.4" fill="#ece4d3">How it works</text>
    <text x="52" y="182" class="serif" font-size="27" fill="#c8f03c">one inspection, then a guard that stays on</text>
    <text x="52" y="218" class="sans" font-size="15.5" fill="#d3cbb9">What happens to another website's AI before it runs in your</text>
    <text x="52" y="240" class="sans" font-size="15.5" fill="#d3cbb9">browser, and what keeps watching while it runs.</text>
      <rect x="52" y="270" width="94" height="32" rx="8" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.16"/>
      <text x="99" y="290" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#ece4d3">NO SERVER</text>
      <rect x="158" y="270" width="158" height="32" rx="8" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.16"/>
      <text x="237" y="290" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#ece4d3">NO AI MODEL NEEDED</text>
      <rect x="328" y="270" width="101" height="32" rx="8" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.16"/>
      <text x="378.5" y="290" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#ece4d3">UNDER 2 MS</text>
    <text x="52" y="340" class="mono" font-size="11" letter-spacing="1.8" fill="#ece4d3" fill-opacity="0.32">P&lt;AGENTCUSTOMS&lt;&lt;READ&lt;CHECK&lt;STAMP&lt;GUARD&lt;&lt;LOCK1&lt;LOCK2&lt;LOCK3&lt;&lt;&lt;</text>
    <rect x="716" y="40" width="436" height="280" rx="16" fill="#07130f" stroke="#ece4d3" stroke-opacity="0.2" stroke-width="1.2"/>
    <rect x="716" y="40" width="436" height="38" rx="16" fill="#0e221b"/>
    <rect x="716" y="62" width="436" height="16" fill="#0e221b"/>
    <line x1="716" y1="78" x2="1152" y2="78" stroke="#ece4d3" stroke-opacity="0.12"/>
    <circle cx="740" cy="59" r="4.5" fill="#f2665a" fill-opacity="0.85"/>
    <circle cx="756" cy="59" r="4.5" fill="#e9c46a" fill-opacity="0.85"/>
    <circle cx="772" cy="59" r="4.5" fill="#8fd1a6" fill-opacity="0.85"/>
    <text x="792" y="63" class="mono" font-size="11.5" fill="#b7b0a0">FOUR STEPS, NO SERVER</text>
    <text x="742" y="110" class="sans" font-size="13" fill="#d3cbb9">Everything below runs in the visitor's browser</text>
    <rect x="742" y="132" width="88" height="74" rx="10" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.16"/>
    <text x="786" y="164" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#ece4d3">Read</text>
    <text x="786" y="184" text-anchor="middle" class="mono" font-size="10" fill="#b7b0a0">agent files</text>
    <line x1="832" y1="169" x2="844" y2="169" stroke="#c8f03c" stroke-width="2"/>
    <rect x="846" y="132" width="88" height="74" rx="10" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.16"/>
    <text x="890" y="164" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#ece4d3">Check</text>
    <text x="890" y="184" text-anchor="middle" class="mono" font-size="10" fill="#b7b0a0">five checks</text>
    <line x1="936" y1="169" x2="948" y2="169" stroke="#c8f03c" stroke-width="2"/>
    <rect x="950" y="132" width="88" height="74" rx="10" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.16"/>
    <text x="994" y="164" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#ece4d3">Stamp</text>
    <text x="994" y="184" text-anchor="middle" class="mono" font-size="10" fill="#b7b0a0">the verdict</text>
    <line x1="1040" y1="169" x2="1052" y2="169" stroke="#c8f03c" stroke-width="2"/>
    <rect x="1054" y="132" width="88" height="74" rx="10" fill="#c8f03c" stroke="#ece4d3" stroke-opacity="0"/>
    <text x="1098" y="164" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#0c1d18">Guard</text>
    <text x="1098" y="184" text-anchor="middle" class="mono" font-size="10" fill="#0c1d18">locks + pins</text>
    <text x="742" y="244" class="mono" font-size="11" fill="#c8f03c">RULES DECIDE THE VERDICT</text>
    <text x="742" y="266" class="mono" font-size="11" fill="#b7b0a0">An AI model only explains it, if you ask</text>
    <text x="742" y="288" class="mono" font-size="11" fill="#b7b0a0">Doubtful wording softens a finding, never hides it</text>
  </g>
</svg>
