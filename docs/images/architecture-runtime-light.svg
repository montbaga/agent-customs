<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-label="While a partner runs, the guard sits between the two assistants: pin check and three locks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/><stop offset="55%" stop-color="#ece4d3"/><stop offset="100%" stop-color="#e3d8c2"/>
    </linearGradient>
    <radialGradient id="glow-lime" cx="0.2" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#c8f03c" stop-opacity="0.24"/><stop offset="100%" stop-color="#c8f03c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="0.85" cy="0.75" r="0.45">
      <stop offset="0%" stop-color="#f2665a" stop-opacity="0.1"/><stop offset="100%" stop-color="#f2665a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#0c1d18" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d6b0a"/>
    </marker>
    <clipPath id="clip"><rect x="4" y="4" width="1192" height="302" rx="20"/></clipPath>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
      @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .pulse { animation: pulseDot 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect x="4" y="4" width="1192" height="302" rx="20" fill="url(#bg)"/>
    <rect x="4" y="4" width="1192" height="302" rx="20" fill="url(#grid)"/>
    <rect x="4" y="4" width="1192" height="302" rx="20" fill="url(#glow-lime)"/>
    <rect x="4" y="4" width="1192" height="302" rx="20" fill="url(#glow-red)"/>
    <text x="34" y="38" class="mono" font-size="11" font-weight="700" letter-spacing="1.4" fill="#3d6b0a">WHILE A PARTNER RUNS</text>
    <text x="1166" y="38" text-anchor="end" class="mono" font-size="11" fill="#0c1d18" fill-opacity="0.58">THE GUARD SITS BETWEEN THE TWO ASSISTANTS</text>
    <line x1="34" y1="52" x2="1166" y2="52" stroke="#0c1d18" stroke-opacity="0.12"/>
    <rect x="34" y="86" width="220" height="196" rx="14" fill="#faf6ee" stroke="#0c1d18" stroke-opacity="0.18"/>
    <rect x="52" y="102" width="38" height="22" rx="6" fill="#0c1d18"/>
    <text x="71" y="117" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">A</text>
    <text x="52" y="152" class="sans" font-size="16.5" font-weight="700" fill="#0c1d18">Your site's AI</text>
    <text x="52" y="176" class="sans" font-size="13" fill="#2d413b">Talks to your visitor.</text>
    <text x="52" y="195" class="sans" font-size="13" fill="#2d413b">Asks the partner for</text>
    <text x="52" y="214" class="sans" font-size="13" fill="#2d413b">help, after the visitor</text>
    <text x="52" y="233" class="sans" font-size="13" fill="#2d413b">agrees on a consent card.</text>
    <rect x="946" y="86" width="220" height="196" rx="14" fill="#faf6ee" stroke="#0c1d18" stroke-opacity="0.18"/>
    <rect x="964" y="102" width="38" height="22" rx="6" fill="#0c1d18"/>
    <text x="983" y="117" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">B</text>
    <text x="964" y="152" class="sans" font-size="16.5" font-weight="700" fill="#0c1d18">Partner's AI</text>
    <text x="964" y="176" class="sans" font-size="13" fill="#2d413b">Another website's</text>
    <text x="964" y="195" class="sans" font-size="13" fill="#2d413b">assistant. It runs in</text>
    <text x="964" y="214" class="sans" font-size="13" fill="#2d413b">your browser, on your</text>
    <text x="964" y="233" class="sans" font-size="13" fill="#2d413b">AI key.</text>
    <rect x="300" y="76" width="600" height="216" rx="16" fill="#0c1d18" />
    <rect x="320" y="92" width="168" height="22" rx="6" fill="#c8f03c"/>
    <text x="404" y="107" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#0c1d18">AGENT CUSTOMS GUARD</text>
    <rect x="320" y="132" width="560" height="30" rx="8" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.12"/>
    <text x="334" y="152" class="mono" font-size="11.5" font-weight="700" fill="#c8f03c">Pin</text>
    <text x="404" y="152" class="sans" font-size="13.5" fill="#ece4d3">Same version you approved? If the files changed, hold.</text>
    <rect x="320" y="170" width="560" height="30" rx="8" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.12"/>
    <text x="334" y="190" class="mono" font-size="11.5" font-weight="700" fill="#c8f03c">Lock 1</text>
    <text x="404" y="190" class="sans" font-size="13.5" fill="#ece4d3">Card numbers, IBANs and keys never leave the browser.</text>
    <rect x="320" y="208" width="560" height="30" rx="8" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.12"/>
    <text x="334" y="228" class="mono" font-size="11.5" font-weight="700" fill="#c8f03c">Lock 2</text>
    <text x="404" y="228" class="sans" font-size="13.5" fill="#ece4d3">Replies are cleaned; actions wait for the visitor's click.</text>
    <rect x="320" y="246" width="560" height="30" rx="8" fill="#132b23" stroke="#ece4d3" stroke-opacity="0.12"/>
    <text x="334" y="266" class="mono" font-size="11.5" font-weight="700" fill="#c8f03c">Lock 3</text>
    <text x="404" y="266" class="sans" font-size="13.5" fill="#ece4d3">A hidden canary word trips if instructions leak.</text>
    <line x1="258" y1="150" x2="296" y2="150" stroke="#3d6b0a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="904" y1="150" x2="942" y2="150" stroke="#3d6b0a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="942" y1="226" x2="904" y2="226" stroke="#3d6b0a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="296" y1="226" x2="258" y2="226" stroke="#3d6b0a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="277" y="140" text-anchor="middle" class="mono" font-size="9.5" fill="#0c1d18" fill-opacity="0.58">ask</text>
    <text x="923" y="216" text-anchor="middle" class="mono" font-size="9.5" fill="#0c1d18" fill-opacity="0.58">reply</text>
  </g>
</svg>
