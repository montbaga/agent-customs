<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="How the Agent Customs Guard checks every partner call">
  <defs>
    <clipPath id="flow-clip">
      <rect x="4" y="4" width="1192" height="272" rx="18"/>
    </clipPath>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#c8f03c"/>
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#8fd1a6"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#f0a35e"/>
    </marker>
    <marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 z" fill="#f2665a"/>
    </marker>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
      @keyframes dashMove {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes guardGlow {
        0%, 100% { stroke-opacity: 0.45; }
        50% { stroke-opacity: 1; }
      }
      .flow-line { stroke-dasharray: 6 6; animation: dashMove 1.4s linear infinite; }
      .guard-card { animation: guardGlow 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .flow-line, .guard-card { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#flow-clip)">
    <rect x="4" y="4" width="1192" height="272" rx="18" fill="#0c1d18"/>

    <text x="34" y="34" class="mono" font-size="11" font-weight="700" letter-spacing="1.4" fill="#c8f03c">LIVE BORDER CHECKPOINT FLOW</text>
    <text x="1166" y="34" text-anchor="end" class="mono" font-size="11" fill="#ece4d3" fill-opacity="0.52">RUNS AFTER CONSENT · BEFORE EXECUTION</text>
    <line x1="34" y1="48" x2="1166" y2="48" stroke="#ece4d3" stroke-opacity="0.1"/>

    <!-- Station 1 -->
    <rect x="34" y="80" width="222" height="148" rx="14" fill="#122821" stroke="#ece4d3" stroke-opacity="0.18"/>
    <rect x="52" y="96" width="38" height="22" rx="6" fill="#1b3a30"/>
    <text x="71" y="111" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">01</text>
    <text x="52" y="144" class="sans" font-size="17" font-weight="700" fill="#ece4d3">Partner call</text>
    <text x="52" y="169" class="sans" font-size="13" fill="#cfc7b5">Your site's AI asks to</text>
    <text x="52" y="187" class="sans" font-size="13" fill="#cfc7b5">consult another website's</text>
    <text x="52" y="205" class="sans" font-size="13" fill="#cfc7b5">agent network.</text>

    <line x1="262" y1="154" x2="294" y2="154" stroke="#c8f03c" stroke-width="2" class="flow-line" marker-end="url(#arrow-lime)"/>

    <!-- Station 2 -->
    <rect x="302" y="80" width="222" height="148" rx="14" fill="#122821" stroke="#ece4d3" stroke-opacity="0.18"/>
    <rect x="320" y="96" width="38" height="22" rx="6" fill="#1b3a30"/>
    <text x="339" y="111" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c8f03c">02</text>
    <text x="320" y="144" class="sans" font-size="17" font-weight="700" fill="#ece4d3">Consent card</text>
    <text x="320" y="169" class="sans" font-size="13" fill="#cfc7b5">Visitor agrees first. If</text>
    <text x="320" y="187" class="sans" font-size="13" fill="#cfc7b5">declined, zero bytes are</text>
    <text x="320" y="205" class="sans" font-size="13" fill="#cfc7b5">fetched or loaded.</text>

    <line x1="530" y1="154" x2="562" y2="154" stroke="#c8f03c" stroke-width="2" class="flow-line" marker-end="url(#arrow-lime)"/>

    <!-- Station 3 -->
    <rect x="570" y="72" width="246" height="164" rx="14" fill="#163329" stroke="#c8f03c" stroke-width="1.6" class="guard-card"/>
    <rect x="588" y="88" width="136" height="22" rx="6" fill="#c8f03c"/>
    <text x="656" y="103" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#0c1d18">03 · CUSTOMS GUARD</text>
    <text x="588" y="138" class="sans" font-size="17" font-weight="700" fill="#ece4d3">Inspect &amp; lock</text>
    <text x="588" y="163" class="sans" font-size="13" fill="#e2dac8">Checks compiled files</text>
    <text x="588" y="181" class="sans" font-size="13" fill="#e2dac8">against fixed rules, pins,</text>
    <text x="588" y="199" class="sans" font-size="13" fill="#e2dac8">and runtime secret locks.</text>
    <text x="588" y="220" class="mono" font-size="10.5" fill="#c8f03c">RULES DECIDE · NOT AN LLM</text>

    <!-- Branching connectors -->
    <path d="M 816 116 C 844 116, 844 91, 868 91" fill="none" stroke="#8fd1a6" stroke-width="2" class="flow-line" marker-end="url(#arrow-ok)"/>
    <path d="M 816 154 L 868 154" fill="none" stroke="#f0a35e" stroke-width="2" class="flow-line" marker-end="url(#arrow-warn)"/>
    <path d="M 816 192 C 844 192, 844 217, 868 217" fill="none" stroke="#f2665a" stroke-width="2" class="flow-line" marker-end="url(#arrow-bad)"/>

    <!-- Outcome 1: Cleared -->
    <rect x="876" y="64" width="290" height="54" rx="11" fill="#102920" stroke="#8fd1a6" stroke-opacity="0.55"/>
    <rect x="890" y="79" width="84" height="24" rx="5" fill="#8fd1a6" fill-opacity="0.16" stroke="#8fd1a6" stroke-opacity="0.5"/>
    <text x="932" y="95" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#8fd1a6">CLEARED</text>
    <text x="986" y="88" class="sans" font-size="13" font-weight="600" fill="#ece4d3">Runs &amp; locks version</text>
    <text x="986" y="105" class="sans" font-size="11.5" fill="#b7b0a0">Saves SHA-256 fingerprint</text>

    <!-- Outcome 2: Held -->
    <rect x="876" y="127" width="290" height="54" rx="11" fill="#261d14" stroke="#f0a35e" stroke-opacity="0.6"/>
    <rect x="890" y="142" width="84" height="24" rx="5" fill="#f0a35e" fill-opacity="0.16" stroke="#f0a35e" stroke-opacity="0.5"/>
    <text x="932" y="158" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f0a35e">HELD</text>
    <text x="986" y="151" class="sans" font-size="13" font-weight="600" fill="#ece4d3">Asks visitor first</text>
    <text x="986" y="168" class="sans" font-size="11.5" fill="#b7b0a0">Shows issues or rug-pull diff</text>

    <!-- Outcome 3: Denied -->
    <rect x="876" y="190" width="290" height="54" rx="11" fill="#291315" stroke="#f2665a" stroke-opacity="0.65"/>
    <rect x="890" y="205" width="84" height="24" rx="5" fill="#f2665a" fill-opacity="0.16" stroke="#f2665a" stroke-opacity="0.55"/>
    <text x="932" y="221" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f2665a">DENIED</text>
    <text x="986" y="214" class="sans" font-size="13" font-weight="600" fill="#ece4d3">Refused immediately</text>
    <text x="986" y="231" class="sans" font-size="11.5" fill="#b7b0a0">Nothing runs; safe summary only</text>

    <!-- Live SMIL Packet Orb gliding along the checkpoint pipeline -->
    <circle r="4.5" fill="#c8f03c">
      <animateMotion dur="3.4s" repeatCount="indefinite" path="M 256 154 L 302 154 M 524 154 L 570 154 M 816 116 C 844 116, 844 91, 874 91"/>
    </circle>

    <rect x="4.75" y="4.75" width="1190.5" height="270.5" rx="17.25" fill="none" stroke="#ece4d3" stroke-opacity="0.15" stroke-width="1.5"/>
  </g>
</svg>
