<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Add it to your site: copy the line, paste it above your scripts, and every partner is checked">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#091712"/><stop offset="55%" stop-color="#0c1d18"/><stop offset="100%" stop-color="#122a22"/></linearGradient>
    <radialGradient id="glow" cx="0.1" cy="0.2" r="0.6"><stop offset="0%" stop-color="#c8f03c" stop-opacity="0.14"/><stop offset="100%" stop-color="#c8f03c" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ece4d3" stroke-opacity="0.045" stroke-width="1"/></pattern>
    <clipPath id="clip"><rect x="2" y="2" width="1196" height="326" rx="20"/></clipPath>
    <style>
      .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#grid)"/>
    <rect width="1200" height="330" fill="url(#glow)"/>
    <text x="36" y="50" class="mono" font-size="14" font-weight="700" letter-spacing="1.8" fill="#c8f03c">ADD IT TO YOUR SITE</text>
    <text x="36" y="92" class="sans" font-size="36" font-weight="600" letter-spacing="-0.6" fill="#ece4d3">Protect your assistant in one line</text>
    <text x="1164" y="92" text-anchor="end" class="sans" font-size="17" fill="#a4a497">No server · no build step · runtime unchanged</text>
    <rect x="36" y="122" width="352" height="176" rx="16" fill="#ece4d3" fill-opacity="0.04" stroke="#ece4d3" stroke-opacity="0.14"/>
    <circle cx="74" cy="162" r="19" fill="#c8f03c"/>
    <text x="74" y="169" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#0c1d18">1</text>
    <g transform="translate(332 146) scale(1.3333333333333333)" fill="none" stroke="#c8f03c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></g>
    <text x="60" y="218" class="sans" font-size="23" font-weight="600" fill="#ece4d3">Copy the line</text>
    <text x="60" y="250" class="sans" font-size="18" fill="#a4a497">The whole guard as one file,</text>
    <text x="60" y="275" class="sans" font-size="18" fill="#a4a497">with a fingerprint checked.</text>
    <g transform="translate(393 196) scale(1.0833333333333333)" fill="none" stroke="#c8f03c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></g>
    <rect x="424" y="122" width="352" height="176" rx="16" fill="#ece4d3" fill-opacity="0.04" stroke="#ece4d3" stroke-opacity="0.14"/>
    <circle cx="462" cy="162" r="19" fill="#c8f03c"/>
    <text x="462" y="169" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#0c1d18">2</text>
    <g transform="translate(720 146) scale(1.3333333333333333)" fill="none" stroke="#c8f03c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7 3.5 12l5 5"/><path d="M15.5 7l5 5-5 5"/><path d="M13.5 4.5l-3 15"/></g>
    <text x="448" y="218" class="sans" font-size="23" font-weight="600" fill="#ece4d3">Paste above your scripts</text>
    <text x="448" y="250" class="sans" font-size="18" fill="#a4a497">In the page that holds your</text>
    <text x="448" y="275" class="sans" font-size="18" fill="#a4a497">assistant, before its scripts.</text>
    <g transform="translate(781 196) scale(1.0833333333333333)" fill="none" stroke="#c8f03c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16"/><path d="M14 6l6 6-6 6"/></g>
    <rect x="812" y="122" width="352" height="176" rx="16" fill="#ece4d3" fill-opacity="0.04" stroke="#ece4d3" stroke-opacity="0.14"/>
    <circle cx="850" cy="162" r="19" fill="#c8f03c"/>
    <text x="850" y="169" text-anchor="middle" class="sans" font-size="18" font-weight="700" fill="#0c1d18">3</text>
    <g transform="translate(1108 146) scale(1.3333333333333333)" fill="none" stroke="#c8f03c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 8-7.5 9.5-4.3-1.5-7.5-4.9-7.5-9.5V6z"/><path d="M8.6 12.2l2.3 2.3 4.6-4.8"/></g>
    <text x="836" y="218" class="sans" font-size="23" font-weight="600" fill="#ece4d3">Every partner is checked</text>
    <text x="836" y="250" class="sans" font-size="18" fill="#a4a497">Before it runs; visitors</text>
    <text x="836" y="275" class="sans" font-size="18" fill="#a4a497">see the stamp in the chat.</text>

  </g>
  <rect x="2" y="2" width="1196" height="326" rx="20" fill="none" stroke="#ece4d3" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>
