# On the 1st of each month, inspects the networks in tools/receipt-sites.json again, signs
# fresh stamps (each is valid for 35 days), saves them and publishes the site.
# Needs the repository secret AGENT_CUSTOMS_SIGNING_KEY: the contents of the private key
# file made by `npm run receipts -- key`. Without that secret, nothing is signed.
name: Sign fresh stamps

on:
  schedule:
    - cron: "41 5 1 * *" # the 1st of each month at 05:41 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect and sign
        env:
          AGENT_CUSTOMS_SIGNING_KEY: ${{ secrets.AGENT_CUSTOMS_SIGNING_KEY }}
        run: npm run receipts -- sign
      - run: npm test
      # A push made with this workflow's token does not start other workflows, so the
      # publishing workflow is started by name.
      - name: Save the stamps and publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add site/receipts
          if git diff --cached --quiet; then echo "No new stamps."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sign fresh stamps"
          git push
          gh workflow run pages.yml --ref main
